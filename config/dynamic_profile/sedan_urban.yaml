name: sedan_urban

# Urban sedan with Ackermann steering - cautious city driving
cfg:
  type: ackermann_follow

  kin:
    caps_fwd:
      max_speed: 10.0
      max_accel: 2.0
      max_decel: 3.5
      cmd_rate_hz: 50.0
      cmd_delay_s: 0.02
      accel_noise_std: 0.02
      steer_noise_std: 0.005
    caps_rev:
      max_speed: 5.0
      max_accel: 1.5
      max_decel: 2.5
      cmd_rate_hz: 50.0
      cmd_delay_s: 0.02
      accel_noise_std: 0.02
      steer_noise_std: 0.005
    wheel_base: 2.7
    max_steer_angle: 0.523 # ~30 deg
    max_steer_rate: 2.094 # ~120 deg/s
    min_turn_radius: 5.0

  pp:
    lookahead_m: 2.0
    min_lookahead_m: 1.5
    max_lookahead_m: 4.0
    speed_coupled_to_curvature: true
    kv: 0.6

  speed_pid:
    kp: 1.3
    ki: 0.18
    kd: 0.08
    integral_windup_limit: 2.5
    d_filter_hz: 6.0

  cruise_speed_min: 6.0
  cruise_speed_max: 10.0
  cornering_speed_min: 3.0
  arrival_stop_decel_bias: 1.3

# City block pattern
waypoints_local:
  points:
    - p_local:
        pos: [0.0, 0.0]
        yaw: 0.0
      wait_s: 0.0
    - p_local:
        pos: [40.0, 0.0]
        yaw: 0.0
      wait_s: 2.0
    - p_local:
        pos: [40.0, 25.0]
        yaw: 1.571
      wait_s: 0.0
    - p_local:
        pos: [0.0, 25.0]
        yaw: 3.142
      wait_s: 2.0

  reached_pos_tol: 0.6
  reached_yaw_tol: 0.12
  loop: true

stop_when_collide_s: 2.5
