name: pedestrian_slow

# Motion controller configuration - slower, more careful pedestrians
cfg:
  type: linear_const_vel

  caps:
    max_speed: 1.0
    max_accel: 0.5
    max_decel: 1.0
    cmd_rate_hz: 20.0
    cmd_delay_s: 0.1
    accel_noise_std: 0.03
    steer_noise_std: 0.0

  speed_min: 0.5
  speed_max: 0.8
  brake_to_stop: true

# Short rectangular patrol path
waypoints_local:
  points:
    - p_local:
        pos: [0.0, 0.0]
        yaw: 0.0
      wait_s: 3.0
    - p_local:
        pos: [5.0, 0.0]
        yaw: 0.0
      wait_s: 2.0
    - p_local:
        pos: [5.0, 3.0]
        yaw: 1.571
      wait_s: 3.0
    - p_local:
        pos: [0.0, 3.0]
        yaw: 3.142
      wait_s: 2.0

  reached_pos_tol: 0.4
  reached_yaw_tol: 0.3
  loop: true

stop_when_collide_s: 2.0
