name: stroller_parent

# Parent pushing stroller - slow and careful
cfg:
  type: linear_const_vel

  caps:
    max_speed: 1.3
    max_accel: 0.6
    max_decel: 1.2
    cmd_rate_hz: 20.0
    cmd_delay_s: 0.08
    accel_noise_std: 0.025
    steer_noise_std: 0.0

  speed_min: 0.7
  speed_max: 1.2
  brake_to_stop: true

# Park/plaza path
waypoints_local:
  points:
    - p_local:
        pos: [0.0, 0.0]
        yaw: 0.0
      wait_s: 5.0 # Pausing to check on child
    - p_local:
        pos: [12.0, 0.0]
        yaw: 0.0
      wait_s: 3.0
    - p_local:
        pos: [12.0, 8.0]
        yaw: 1.571
      wait_s: 5.0
    - p_local:
        pos: [0.0, 8.0]
        yaw: 3.142
      wait_s: 3.0

  reached_pos_tol: 0.5
  reached_yaw_tol: 0.25
  loop: true

stop_when_collide_s: 2.5
