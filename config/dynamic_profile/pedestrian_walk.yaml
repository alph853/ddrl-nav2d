name: pedestrian_walk

# Motion controller configuration
cfg:
  type: linear_const_vel  # Variant indicator

  caps:
    max_speed: 1.5
    max_accel: 0.8
    max_decel: 1.5
    cmd_rate_hz: 20.0
    cmd_delay_s: 0.05
    accel_noise_std: 0.02
    steer_noise_std: 0.0

  speed_min: 1.0
  speed_max: 1.5
  brake_to_stop: true

# Waypoints in local coordinates
waypoints_local:
  points:
    - p_local:
        pos: [0.0, 0.0]
        yaw: 0.0
      wait_s: 2.0
    - p_local:
        pos: [10.0, 0.0]
        yaw: 0.0
      wait_s: 3.0
    - p_local:
        pos: [10.0, 5.0]
        yaw: 1.571
      wait_s: 2.0
    - p_local:
        pos: [0.0, 5.0]
        yaw: 3.142
      wait_s: 3.0

  reached_pos_tol: 0.3
  reached_yaw_tol: 0.2
  loop: true

stop_when_collide_s: 1.5
