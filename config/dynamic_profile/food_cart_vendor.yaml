name: food_cart_vendor

# Food cart being pushed to different locations
cfg:
  type: linear_const_vel

  caps:
    max_speed: 0.8
    max_accel: 0.3
    max_decel: 0.6
    cmd_rate_hz: 15.0
    cmd_delay_s: 0.15
    accel_noise_std: 0.02
    steer_noise_std: 0.0

  speed_min: 0.3
  speed_max: 0.7
  brake_to_stop: true

# Moving between vending spots
waypoints_local:
  points:
    - p_local:
        pos: [0.0, 0.0]
        yaw: 0.0
      wait_s: 30.0 # Selling at this spot
    - p_local:
        pos: [20.0, 0.0]
        yaw: 0.0
      wait_s: 25.0 # Selling at this spot
    - p_local:
        pos: [20.0, 15.0]
        yaw: 1.571
      wait_s: 30.0
    - p_local:
        pos: [0.0, 15.0]
        yaw: 3.142
      wait_s: 25.0

  reached_pos_tol: 0.4
  reached_yaw_tol: 0.3
  loop: true

stop_when_collide_s: 2.0
