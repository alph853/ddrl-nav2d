name: traffic_car

# Motion controller configuration
cfg:
  type: ackermann_follow  # Variant indicator: linear_const_vel, linear_pid, ackermann_follow

  kin:
    caps_fwd:
      max_speed: 10.0
      max_accel: 2.0
      max_decel: 4.0
      cmd_rate_hz: 50.0
      cmd_delay_s: 0.01
      accel_noise_std: 0.03
      steer_noise_std: 0.008
    caps_rev:
      max_speed: 4.0
      max_accel: 1.5
      max_decel: 3.0
      cmd_rate_hz: 50.0
      cmd_delay_s: 0.01
      accel_noise_std: 0.03
      steer_noise_std: 0.008
    wheel_base: 2.5
    max_steer_angle: 0.436  # ~25 deg
    max_steer_rate: 1.396   # ~80 deg/s
    min_turn_radius: 6.0

  pp:  # Pure pursuit configuration
    lookahead_m: 3.0
    min_lookahead_m: 1.5
    max_lookahead_m: 5.5
    speed_coupled_to_curvature: true
    kv: 0.5  # speed reduction factor

  speed_pid:
    kp: 1.5
    ki: 0.2
    kd: 0.1
    integral_windup_limit: 3.0
    d_filter_hz: 5.0

  cruise_speed_min: 6.0
  cruise_speed_max: 10.0
  cornering_speed_min: 3.0
  arrival_stop_decel_bias: 1.2

# Waypoints in local coordinates
waypoints_local:
  points:
    - p_local:
        pos: [0.0, 0.0]
        yaw: 0.0
      wait_s: 0.0
    - p_local:
        pos: [50.0, 0.0]
        yaw: 0.0
      wait_s: 1.0
    - p_local:
        pos: [50.0, 30.0]
        yaw: 1.571  # 90 deg
      wait_s: 0.0
    - p_local:
        pos: [0.0, 30.0]
        yaw: 3.142  # 180 deg
      wait_s: 1.0

  reached_pos_tol: 0.5
  reached_yaw_tol: 0.1
  loop: true

stop_when_collide_s: 3.0
