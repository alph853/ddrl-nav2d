name: jungle_patch
category: vegetation
parts:
  # Main tree
  - name: main_trunk
    geom:
      type: circle
      radius: 0.6
      z_min: 0.0
      z_max: 10.0
    material:
      name: jungle_bark
      rgba: [0.35, 0.25, 0.15, 1.0]
    rel_pose:
      pos: [0.0, 0.0]
      yaw: 0.0

  - name: main_canopy
    geom:
      type: circle
      radius: 3.0
      z_min: 7.0
      z_max: 14.0
    material:
      name: jungle_leaves
      rgba: [0.15, 0.45, 0.15, 1.0]
    rel_pose:
      pos: [0.0, 0.0]
      yaw: 0.0

  # Side tree 1
  - name: side_trunk_1
    geom:
      type: circle
      radius: 0.4
      z_min: 0.0
      z_max: 7.0
    material:
      name: jungle_bark
      rgba: [0.4, 0.3, 0.2, 1.0]
    rel_pose:
      pos: [2.5, 2.0]
      yaw: 0.0

  - name: side_canopy_1
    geom:
      type: circle
      radius: 2.0
      z_min: 5.0
      z_max: 10.0
    material:
      name: jungle_leaves
      rgba: [0.2, 0.5, 0.2, 1.0]
    rel_pose:
      pos: [2.5, 2.0]
      yaw: 0.0

  # Side tree 2
  - name: side_trunk_2
    geom:
      type: circle
      radius: 0.35
      z_min: 0.0
      z_max: 6.0
    material:
      name: jungle_bark
      rgba: [0.38, 0.28, 0.18, 1.0]
    rel_pose:
      pos: [-2.0, 1.5]
      yaw: 0.0

  - name: side_canopy_2
    geom:
      type: circle
      radius: 1.8
      z_min: 4.5
      z_max: 9.0
    material:
      name: jungle_leaves
      rgba: [0.18, 0.48, 0.18, 1.0]
    rel_pose:
      pos: [-2.0, 1.5]
      yaw: 0.0

  # Understory bushes
  - name: bush_1
    geom:
      type: circle
      radius: 1.2
      z_min: 0.0
      z_max: 2.0
    material:
      name: jungle_bush
      rgba: [0.25, 0.55, 0.25, 1.0]
    rel_pose:
      pos: [1.5, -2.0]
      yaw: 0.0

  - name: bush_2
    geom:
      type: circle
      radius: 1.0
      z_min: 0.0
      z_max: 1.5
    material:
      name: jungle_bush
      rgba: [0.28, 0.58, 0.28, 1.0]
    rel_pose:
      pos: [-1.8, -1.5]
      yaw: 0.0

  # Vines/hanging foliage
  - name: hanging_vines
    geom:
      type: box
      hx: 0.3
      hy: 0.3
      z_min: 3.0
      z_max: 7.0
    material:
      name: vines
      rgba: [0.2, 0.4, 0.15, 0.8]
    rel_pose:
      pos: [0.8, 0.8]
      yaw: 0.0
