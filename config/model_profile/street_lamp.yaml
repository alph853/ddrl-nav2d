name: street_lamp
category: infrastructure
parts:
  - name: base
    geom:
      type: circle
      radius: 0.3
      z_min: 0.0
      z_max: 0.3
    material:
      name: lamp_base
      rgba: [0.3, 0.3, 0.3, 1.0] # dark gray
    rel_pose:
      pos: [0.0, 0.0]
      yaw: 0.0

  - name: pole
    geom:
      type: circle
      radius: 0.12
      z_min: 0.3
      z_max: 5.0
    material:
      name: lamp_pole
      rgba: [0.4, 0.4, 0.4, 1.0] # gray
    rel_pose:
      pos: [0.0, 0.0]
      yaw: 0.0

  - name: lamp_head
    geom:
      type: box
      hx: 0.4
      hy: 0.3
      z_min: 4.8
      z_max: 5.2
    material:
      name: lamp_fixture
      rgba: [0.9, 0.9, 0.7, 1.0] # light yellow
    rel_pose:
      pos: [0.3, 0.0]
      yaw: 0.0
