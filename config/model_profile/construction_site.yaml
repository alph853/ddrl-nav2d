  # Perimeter fence
  - name: fence_front
    geom:
      type: box
      hx: 10.0
      hy: 0.1
      z_min: 0.0
      z_max: 2.5
    material:
      name: construction_fence
      rgba: [0.9, 0.6, 0.0, 1.0]
    rel_pose:
      pos: [0.0, 8.0]
      yaw: 0.0

  - name: fence_back
    geom:
      type: box
      hx: 10.0
      hy: 0.1
      z_min: 0.0
      z_max: 2.5
    material:
      name: construction_fence
      rgba: [0.9, 0.6, 0.0, 1.0]
