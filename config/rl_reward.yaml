reward:
  reward_type: default
  terminate_on_goal: true
  weights:
    progress: 40.0
    progress_norm_speed_m_s: 8.0
    # Minimum net progress rate required to earn progress reward (prevents orbit/dither exploits)
    progress_gate_epsilon_m_s: 0.05
    # Penalize movement / path length (normalized by `progress_norm_speed_m_s`).
    effort_penalty: -0.8
    # Softer penalties for expert demonstration collection.
    steer_penalty: -1.0
    steer_penalty_tau_s: 10.0
    progress_steer_gate_min: 0.4
    progress_steer_gate_power: 1.0
    steer_norm_abs: 0.5
    heading_to_goal_reward: 0.2
    proximity_reward: -0.5
    clearance_gate_dist_min_m: 1.5
    clearance_gate_dist_max_m: 5.0
    clearance_gate_half_angle_rad: 0.45

    # Time pressure
    time_penalty: -0.1
    time_limit_penalty: -10.0

    # Safety
    collision_penalty_scale: -10.0

    # Discourage sustained reverse requests with an EMA ramp plus gear-switch penalty.
    reverse_penalty: -1.0
    reverse_penalty_tau_s: 10.0
    gear_switch_penalty: -0.3

    # Stall: windowed net progress rate + EMA ramp + hard termination
    stall_window_s: 10.0
    stall_progress_epsilon: 0.05
    stall_tau_s: 10.0
    stall_penalty_scale: -1.0
    stall_limit: 0.98
    stall_terminal_penalty: -100.0

    # Success
    waypoint_reached_bonus: 10.0
    goal_reached_bonus: 100.0
