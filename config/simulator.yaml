      #   success_rate_window: 15
      #   maps: [map_intro_2, map_intro_3, map_intro_4]
      #   spawn:
      #     min_active_objects: 0
      #     max_active_objects: 0
      #     min_inter_object_distance: 8

      # - name: easy0
      #   promote_on_success_rate: 0.9
      #   success_rate_window: 30
      #   maps: [map_easy_1, map_easy_2]
      #   spawn:
      #     min_active_objects: 0
      #     max_active_objects: 0
      #     min_inter_object_distance: 8

      # - name: intro2
      #   promote_on_success_rate: 0.9
      #   success_rate_window: 30
      #   maps: [map_intro_1]
      #   spawn:
      #     min_spawn_distance: 70
